name: Tests

permissions:
    contents: write
on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    changes:
        runs-on: ubuntu-latest
        name: Assess changes
        steps:
            -   name: 💖 Checkout repository 💖
                uses: actions/checkout@v6

            -   name: 💖 Decide checks 💖
                uses: tj-actions/changed-files@v47
                id: changes
                with:
                    files_ignore_from_source_file: .github/autosync/Skip.txt
        outputs:
            code_changed: ${{ steps.changes.outputs.any_changed }}

    Linux:
        runs-on: ubuntu-24.04
        name: Ubuntu 24.04
        needs: changes
        if: needs.changes.outputs.code_changed == 'true'
        steps:
            -   name: 💖 Install Swift 💖
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: 6.4.1-RELEASE

            -   name: 💖 Checkout repository 💖
                uses: actions/checkout@v6

            -   name: 💖 Run tests 💖
                run: Scripts/TestAll

            -   name: 💖 Package (dry run) 💖
                run: Scripts/Package

            -   name: 💖 Update badge 💖
                uses: rarestype/rarestbadge@v1
                if: always()

    macOS:
        runs-on: xcode-27
        needs: changes
        if: needs.changes.outputs.code_changed == 'true'
        steps:
            -   name: 💖 Checkout repository 💖
                uses: actions/checkout@v6

            -   name: 💖 Select Xcode 27.2 💖
                run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

            -   name: 💖 Run tests 💖
                run: Scripts/TestAll

            -   name: 💖 Package (dry run) 💖
                run: Scripts/Package

            -   name: 💖 Update badge 💖
                uses: rarestype/rarestbadge@v1
                if: always()

    macOS-devices:
        strategy:
            matrix:
                destination: [iOS, tvOS, visionOS, watchOS]
        needs: changes
        if: needs.changes.outputs.code_changed == 'true'
        name: ${{ matrix.destination }}
        uses: rarestype/swift-device-action/.github/workflows/build.yml@v1
        with:
            xcode-scheme: 'swift-json-Package'
            destination: ${{ matrix.destination }}
            badge-namespace: ${{ github.workflow }}


    benchmarks:
        strategy:
            matrix:
                platform:
                    -   arch: x86_64
                        runs-on: ubuntu-24.04
                    -   arch: aarch64
                        runs-on: ubuntu-24.04-arm

        runs-on: ${{ matrix.platform['runs-on'] }}
        name: Benchmark (${{ matrix.platform.arch }})
        needs: changes
        if: needs.changes.outputs.code_changed == 'true' && github.event_name == 'pull_request'
        steps:
            -   name: 🩵 Install Swift 🩵
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: 6.4.1-RELEASE

            -   name: 🩵 Checkout repository 🩵
                uses: actions/checkout@v6

            -   name: 🩵 Run benchmarks 🩵
                run: Scripts/Benchmark

            -   name: 🩵 Upload benchmark timings 🩵
                uses: actions/upload-artifact@v7
                with:
                    name: timings-${{ matrix.platform.arch }}
                    path: '*.duration'
                    retention-days: 1
                    compression-level: 0
